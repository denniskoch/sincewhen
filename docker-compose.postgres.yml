# Override that swaps SQLite for Postgres. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build

services:
  app:
    environment:
      DB_CLIENT: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-sincewhen}:${POSTGRES_PASSWORD:-sincewhen}@db:5432/${POSTGRES_DB:-sincewhen}
    depends_on:
      db:
        condition: service_healthy
    volumes: []

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sincewhen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sincewhen}
      POSTGRES_DB: ${POSTGRES_DB:-sincewhen}
    volumes:
      - sincewhen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sincewhen} -d ${POSTGRES_DB:-sincewhen}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sincewhen-postgres:
