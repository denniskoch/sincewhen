name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

  test:
    name: Tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @sincewhen/shared build

      # Both backends run the identical suite, because the promise this project
      # makes is that they behave the same.
      - name: Start Postgres
        if: matrix.backend == 'postgres'
        run: |
          docker run -d --name test-pg \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            -p 5432:5432 postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec test-pg pg_isready -U test -d test && break
            sleep 1
          done

      - name: Run tests
        run: pnpm --filter @sincewhen/server test
        env:
          TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgres://test:test@localhost:5432/test' || '' }}

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing happens in release.yml. This just keeps a broken
      # Dockerfile from reaching main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: sincewhen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          SESSION_SECRET="$(openssl rand -base64 32)"

          docker run -d --name sincewhen-smoke -p 8080:3000 \
            -e ADMIN_PASSWORD=ci-admin-password \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e PAGE_TITLE="CI Smoke Test" \
            sincewhen:ci

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 2
          done

          echo "--- health ---"
          curl -fsS http://localhost:8080/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          echo "--- page title is configurable at runtime ---"
          curl -fsS http://localhost:8080/api/config | grep -q 'CI Smoke Test'

          echo "--- frontend is served ---"
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root">'

          echo "--- writes are closed without auth ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/counters)" = "401"

      - name: Container logs
        if: always()
        run: docker logs sincewhen-smoke || true
